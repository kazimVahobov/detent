name: release

# A tag is the only way anything reaches npm. Nothing is published by hand, so
# what is on the registry can always be traced to a commit in this repository.

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # trusted publishing and the provenance signature both use this

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # No registry-url on purpose: it writes an .npmrc expecting a token in the
      # environment, and there is no token to put there.

      # Trusted publishing authenticates over OIDC, which needs npm 11.5.1 or
      # newer; Node 22 ships 10.x. Pinned to the major rather than @latest —
      # the step that performs the publish should not change underneath a
      # release nobody is watching.
      - run: npm install -g npm@^11.5.1

      # The gauge gates the release exactly as it gates a merge. npm would run
      # it again through prepublishOnly; having it as its own step means a red
      # gauge fails before anything is signed.
      - run: npm run verify

      - name: the tag and package.json must agree
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p 'require("./package.json").version')"
          if [ "$tag" != "$pkg" ]; then
            echo "tag says $tag, package.json says $pkg — refusing to publish" >&2
            exit 1
          fi
          # A prerelease (0.1.0-rc.1, cut from staging) must never become the
          # version a plain `npm install` resolves to.
          case "$pkg" in
            *-*) echo "dist_tag=next" >> "$GITHUB_ENV" ;;
            *) echo "dist_tag=latest" >> "$GITHUB_ENV" ;;
          esac

      # No credential: the registry trusts this repository and this workflow
      # file by name, and npm exchanges the run's OIDC identity for a
      # short-lived one. Nothing long-lived is stored, so there is nothing to
      # rotate and nothing to leak.
      - run: npm publish --provenance --tag "$dist_tag"
