name: verify

on:
  push:
    branches: [main, staging, dev, 'agent/**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # No install step: the project claims zero dependencies, and
      # check-no-deps.mjs is what keeps that claim honest.
      - run: npm run verify
